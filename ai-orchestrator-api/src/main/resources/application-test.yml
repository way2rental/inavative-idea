# Test Profile Configuration

spring:
  application:
    name: ai-orchestrator-test

  # H2 Database for testing
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
    driver-class-name: org.h2.Driver

  # JPA Configuration
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect

  # Disable Redis for tests
  data:
    redis:
      host: localhost
      port: 6379

# Ollama Configuration (disabled for tests)
ollama:
  base-url:
  model: llama3:8b
  timeout-seconds: 10
  enabled: false

# JWT Configuration
jwt:
  secret: test-secret-key-for-jwt-token-generation-in-tests
  expiration: 3600000

# Logging
logging:
  level:
    root: WARN
    com.enterprise.ai: DEBUG
