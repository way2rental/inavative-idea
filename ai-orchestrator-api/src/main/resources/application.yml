# AI Orchestrator Application Configuration - Enterprise Runtime Platform
# Dynamic Executor Architecture with Read-Only Enforcement

spring:
  application:
    name: ai-orchestrator

  # Database Configuration
  datasource:
    url: jdbc:mysql://localhost:3306/ai_orchestrator_v4?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 5000       # Hard 5s connection timeout
      validation-timeout: 3000
      max-lifetime: 1800000

  # JPA Configuration
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true
        jdbc:
          time_zone: UTC
          batch_size: 25

  # Flyway Migration (for V2 schema)
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  # Redis Configuration (optional)
  data:
    redis:
      host: localhost
      port: 6379
      timeout: 2000ms

  ai:
    active-provider: openai
    retry:
      max-attempts: 3
      backoff:
        initial-interval: 1000
        multiplier: 2
        max-interval: 5000

    # Ollama Configuration
#    ollama:
#      base-url: http://localhost:11434
#      chat:
#        enabled: true
#        options:
#          model: mistral:7b          # Model for general responses
#          temperature: 0.3
#          num-predict: 1024
#          top-k: 40
#          top-p: 0.9
#      timeout:
#        connection: 5s
#        read: 120s
#        write: 60s

    # OpenAI Configuration (enable when needed)
    openai:
      api-key: ${OPENAI_API_KEY:${OPEN_API_KEY:}}
      chat:
        enabled: true
        options:
          model: gpt-4o-mini        # or gpt-4, gpt-3.5-turbo
          temperature: 0.3
          max-tokens: 1024
          top-p: 1.0
          frequency-penalty: 0.0
          presence-penalty: 0.0

    # Azure OpenAI Configuration (enable when needed)
    azure:
      openai:
        api-key: ${AZURE_OPENAI_API_KEY:your-azure-key}
        endpoint: ${AZURE_OPENAI_ENDPOINT:https://your-resource.openai.azure.com/}
        chat:
          enabled: false
          options:
            deployment-name: gpt-4
            temperature: 0.3
            max-tokens: 1024


# Server Configuration
server:
  port: 8080
  servlet:
    context-path: /
  compression:
    enabled: true
    mime-types: application/json,text/event-stream

# ============================================
# LLM OPERATION CONFIGURATION
# ============================================
llm:
  timeout:
    detection-seconds: 30        # Intent detection timeout
    generation-seconds: 120      # Response generation timeout
    streaming-seconds: 150       # Streaming response timeout
  models:
    intent: mistral:7b          # Model for intent detection
    formatter: mistral:7b        # Model for response formatting
  two-stage-detection: false    # Enable for 150+ scenarios
  streaming-enabled: true       # Enable SSE streaming

# ============================================
# BUSINESS DATA SERVICE CONFIGURATION
# ============================================
business-data:
  base-url: http://localhost:8081      # Business data service URL
  timeout-ms: 5000                     # 5s API timeout
  connection-timeout-ms: 2000          # 2s connection timeout
  mock-mode: true                      # Set to false for real API calls
  endpoints:
    TXN_STATUS:
      path: /api/transactions/${txnId}
      method: GET
      timeout-ms: 5000
    FILE_STATUS:
      path: /api/files/status
      method: POST
      body-template: '{"fileName": "${fileName}"}'
      timeout-ms: 10000
    ACCOUNT_SUMMARY:
      path: /api/accounts/${accountId}/summary
      method: GET
      timeout-ms: 5000

# ============================================
# INTENT DETECTION CONFIGURATION
# ============================================
intent:
  confidence:
    threshold: 0.75                    # Minimum confidence for direct execution
    low-threshold: 0.60                # Below this, ask for clarification
  require-confirmation:
    enabled: true                      # Require user confirmation for moderate confidence
    threshold: 0.85                    # Above this, no confirmation needed

# ============================================
# RUNTIME PROTECTION LIMITS
# ============================================
runtime:
  protection:
    max-execution-time-ms: 150000      # 150s total execution limit (to accommodate slow LLM responses)
    max-ollama-timeout-ms: 120000      # 120s LLM timeout
    max-db-timeout-ms: 5000            # 5s DB query timeout
    max-scenario-timeout-ms: 30000     # 30s per scenario
  dry-run-mode: false                  # Global dry-run mode (for testing)

# ============================================
# RATE LIMITING CONFIGURATION
# ============================================
rate-limit:
  requests-per-minute: 30              # Per-user rate limit
  timeout-seconds: 5                   # Rate limiter timeout

# ============================================
# JWT CONFIGURATION
# ============================================
# SECURITY CRITICAL: JWT secret MUST be provided via environment variable
# Application will FAIL TO START if secret is missing or insecure
jwt:
  # Secret loaded from environment variable JWT_SECRET (preferred) or this property
  # DO NOT use default values in production
  secret: ${JWT_SECRET:}
  expiration: 86400000                 # 24 hours in milliseconds

# ============================================
# RESILIENCE4J CONFIGURATION
# ============================================
resilience4j:
  circuitbreaker:
    instances:
      ollama:
        slidingWindowSize: 10
        minimumNumberOfCalls: 3
        failureRateThreshold: 50
        waitDurationInOpenState: 30000
        permittedNumberOfCallsInHalfOpenState: 3
        slowCallDurationThreshold: 60000
        slowCallRateThreshold: 80
  retry:
    instances:
      ollama:
        maxAttempts: 3
        waitDuration: 1000
        enableExponentialBackoff: true
        exponentialBackoffMultiplier: 2
        retryExceptions:
          - com.enterprise.ai.common.exception.LlmException
          - org.springframework.web.reactive.function.client.WebClientResponseException
  ratelimiter:
    instances:
      ollama:
        limitForPeriod: 10
        limitRefreshPeriod: 1s
        timeoutDuration: 5s
  timelimiter:
    instances:
      ollama:
        timeoutDuration: 120s
        cancelRunningFuture: true

# ============================================
# PERFORMANCE LOGGING
# ============================================
logging:
  level:
    root: INFO
    com.enterprise.ai: DEBUG
    com.enterprise.ai.api.service.PerformanceLoggingService: INFO
    com.enterprise.ai.core.security: DEBUG
    org.springframework.security: INFO
    io.github.resilience4j: DEBUG
    org.springframework.web.reactive: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"

# ============================================
# ACTUATOR CONFIGURATION
# ============================================
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,env,beans,configprops,loggers,threaddump,heapdump,caches,mappings,circuitbreakers,ratelimiters,scheduledtasks
      base-path: /actuator
      cors:
        allowed-origins: "*"
        allowed-methods: GET,POST
  endpoint:
    health:
      show-details: when-authorized
      show-components: when-authorized
      probes:
        enabled: true
    env:
      show-values: when-authorized
  health:
    db:
      enabled: true
    diskspace:
      enabled: true
    defaults:
      enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
    export:
      simple:
        enabled: true
  info:
    env:
      enabled: true
    java:
      enabled: true
    os:
      enabled: true

# ============================================
# OPENAPI CONFIGURATION
# ============================================
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
