version: "3.9"

services:
  # MySQL Database
  mysql:
    image: mysql:8.0
    container_name: ai-orchestrator-db
    restart: unless-stopped
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: ai_orchestrator
      MYSQL_USER: aiuser
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-aipassword}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 1g

  # AI Orchestrator Backend
  ai-orchestrator:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ai-orchestrator-api
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/ai_orchestrator?useSSL=false&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: aiuser
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD:-aipassword}
      JWT_SECRET: ${JWT_SECRET:-your-256-bit-secret-key-for-jwt-token-generation-change-in-production}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      SPRING_PROFILES_ACTIVE: production
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/public/health/live"]
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 1g

  # Angular Frontend (optional - for development)
  # Uncomment to include frontend in docker-compose
  # ai-orchestrator-ui:
  #   build:
  #     context: ./ai-orchestrator-ui
  #     dockerfile: Dockerfile
  #   container_name: ai-orchestrator-ui
  #   ports:
  #     - "4200:80"
  #   depends_on:
  #     - ai-orchestrator

volumes:
  mysql_data:
