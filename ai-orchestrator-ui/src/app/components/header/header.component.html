<!-- Enhanced Axis Bank Header with Icons -->
<header class="bg-gradient-to-r from-axis-burgundy via-axis-maroon to-axis-burgundy text-white shadow-lg sticky top-0 z-50 h-16">
  <div class="px-6 lg:px-8 h-full">
    <div class="flex items-center justify-between h-full">
      <!-- Logo Section - Axis Bank Style -->
      <div class="flex items-center gap-3">
        <a routerLink="/chat" class="flex items-center gap-3 hover:opacity-90 transition-opacity">
          <!-- Axis Bank Logo -->
          <img src="Axis_Bank-Logo.wine.svg" alt="Axis Bank" class="h-12 w-auto">
          <!-- Text -->
          <div class="flex items-center gap-2">
            <span class="text-xl font-bold tracking-wide">AXIS BANK</span>
          </div>
        </a>
        <!-- AI Orchestrator Label -->
        <div class="border-l border-white/30 pl-3 ml-2 flex items-center gap-2">
          <svg class="w-5 h-5 text-white/80" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9.75 17L9 20l-1 1h8l-1-1-.75-3M3 13h18M5 17h14a2 2 0 002-2V5a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z" />
          </svg>
          <span class="text-sm font-medium text-white/90">AI Orchestrator</span>
        </div>
      </div>

      <!-- Navigation - Simplified when on Admin pages (sidebar handles navigation) -->
      <nav class="hidden md:flex items-center gap-1">
        <!-- Chat - Always visible -->
        <a routerLink="/chat" routerLinkActive="bg-white/20"
           class="flex items-center gap-2 px-4 py-2 rounded-lg hover:bg-white/10 transition-all">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z" />
          </svg>
          <span class="text-sm font-medium">Chat</span>
        </a>

        @if (canAccessAdmin()) {
          <!-- Admin Dashboard Link - Shows when not on admin page -->
          @if (!isOnAdminPage) {
            <a routerLink="/admin"
               class="flex items-center gap-2 px-4 py-2 rounded-lg hover:bg-white/10 transition-all">
              <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2V6zM14 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V6zM4 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2v-2zM14 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z" />
              </svg>
              <span class="text-sm font-medium">Admin Panel</span>
            </a>
          }

          <!-- Current section indicator when on admin pages -->
          @if (isOnAdminPage) {
            <div class="flex items-center gap-2 px-4 py-2 bg-white/20 rounded-lg">
              <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z" />
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
              </svg>
              <span class="text-sm font-medium">Admin Panel</span>
            </div>
          }
        }
      </nav>

      <!-- User Info with Enhanced Design -->
      @if (currentUser) {
        <div class="flex items-center gap-4">
          <!-- Notifications (placeholder) -->
          <button class="relative p-2 hover:bg-white/10 rounded-lg transition-colors">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9" />
            </svg>
            <span class="absolute top-1 right-1 w-2 h-2 bg-green-400 rounded-full animate-pulse"></span>
          </button>

          <!-- User Avatar and Info -->
          <div class="flex items-center gap-3 pl-3 border-l border-white/20">
            <div class="w-10 h-10 bg-white/20 rounded-full flex items-center justify-center ring-2 ring-white/30">
              <span class="text-white font-bold">{{ currentUser.username.charAt(0).toUpperCase() }}</span>
            </div>
            <div class="hidden sm:block">
              <p class="text-sm font-medium">{{ currentUser.username }}</p>
              <p class="text-xs text-white/70 flex items-center gap-1">
                <svg class="w-3 h-3" fill="currentColor" viewBox="0 0 20 20">
                  <path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm3.707-9.293a1 1 0 00-1.414-1.414L9 10.586 7.707 9.293a1 1 0 00-1.414 1.414l2 2a1 1 0 001.414 0l4-4z" clip-rule="evenodd"/>
                </svg>
                {{ currentUser.role }}
              </p>
            </div>
          </div>

          <!-- Logout Button -->
          <button (click)="logout()"
            class="flex items-center gap-2 px-4 py-2 bg-white/10 hover:bg-white/20 rounded-lg text-sm font-medium transition-all hover:scale-105">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1" />
            </svg>
            <span class="hidden sm:inline">Logout</span>
          </button>
        </div>
      }
    </div>
  </div>
</header>
