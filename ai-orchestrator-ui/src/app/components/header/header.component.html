<!-- Axis Bank Header -->
<header class="bg-axis-burgundy text-white shadow-md">
  <div class="px-6 lg:px-8 py-3">
    <div class="flex items-center justify-between">
      <!-- Logo Section - Axis Bank Style -->
      <div class="flex items-center gap-3">
        <a routerLink="/chat" class="flex items-center gap-3 hover:opacity-90 transition-opacity">
          <!-- Axis Bank Logo -->
          <img src="Axis_Bank-Logo.wine.svg" alt="Axis Bank" class="h-12 w-auto">
          <!-- Text -->
          <div class="flex items-center gap-2">
            <span class="text-xl font-bold tracking-wide">AXIS BANK</span>
          </div>
        </a>
        <!-- AI Orchestrator Label -->
        <div class="border-l border-white/30 pl-3 ml-2">
          <span class="text-sm font-medium text-white/90">AI Orchestrator</span>
        </div>
      </div>

      <!-- Navigation - Role Based -->
      <nav class="hidden md:flex items-center gap-6 text-sm">
        <a routerLink="/chat" routerLinkActive="underline" class="hover:underline">Chat</a>
        @if (canAccessAdmin()) {
          <a routerLink="/admin" routerLinkActive="underline" class="hover:underline">Admin Dashboard</a>
          <a routerLink="/admin/scenarios" routerLinkActive="underline" class="hover:underline">Scenarios</a>
          <a routerLink="/admin/settings" routerLinkActive="underline" class="hover:underline">Settings</a>
        }
        @if (canAccessAuditLogs()) {
          <a routerLink="/admin/audit-logs" routerLinkActive="underline" class="hover:underline">Audit Logs</a>
          <a routerLink="/admin/sessions" routerLinkActive="underline" class="hover:underline">Sessions</a>
        }
      </nav>

      <!-- User Info -->
      @if (currentUser) {
        <div class="flex items-center gap-4">
          <div class="flex items-center gap-3">
            <div class="w-9 h-9 bg-white/20 rounded-full flex items-center justify-center">
              <span class="text-white font-bold text-sm">{{ currentUser.username.charAt(0).toUpperCase() }}</span>
            </div>
            <div class="hidden sm:block">
              <p class="text-sm font-medium">{{ currentUser.username }}</p>
              <p class="text-xs text-white/70">{{ currentUser.role }}</p>
            </div>
          </div>
          <button (click)="logout()"
            class="px-4 py-2 bg-white/10 hover:bg-white/20 rounded-lg text-sm font-medium transition-colors">
            Logout
          </button>
        </div>
      }
    </div>
  </div>
</header>
