<div class="min-h-screen bg-gradient-to-br from-slate-900 via-slate-800 to-slate-900 flex items-center justify-center p-4">
  <!-- Background Effects -->
  <div class="absolute inset-0 overflow-hidden">
    <div class="absolute -top-40 -right-40 w-80 h-80 bg-primary-500/20 rounded-full blur-3xl"></div>
    <div class="absolute -bottom-40 -left-40 w-80 h-80 bg-purple-500/20 rounded-full blur-3xl"></div>
  </div>

  <div class="relative w-full max-w-md">
    <!-- Login Card -->
    <div class="card p-8">
      <!-- Header -->
      <div class="text-center mb-8">
        <div class="w-20 h-20 bg-gradient-to-br from-primary-500 to-purple-500 rounded-2xl flex items-center justify-center mx-auto mb-6 shadow-lg shadow-primary-500/25">
          <svg class="w-10 h-10 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9.75 17L9 20l-1 1h8l-1-1-.75-3M3 13h18M5 17h14a2 2 0 002-2V5a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z" />
          </svg>
        </div>
        <h1 class="text-3xl font-bold gradient-text mb-2">AI Orchestrator</h1>
        <p class="text-slate-400">Enterprise Scenario-Driven AI Platform</p>
      </div>

      <!-- Form -->
      <form (ngSubmit)="login()" class="space-y-6">
        <div>
          <label for="username" class="block text-sm font-medium text-slate-300 mb-2">Username</label>
          <div class="relative">
            <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
              <svg class="w-5 h-5 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" />
              </svg>
            </div>
            <input
              type="text"
              id="username"
              [(ngModel)]="username"
              name="username"
              placeholder="Enter your username"
              [disabled]="isLoading"
              class="input-field pl-12"
            />
          </div>
        </div>

        <div>
          <label for="role" class="block text-sm font-medium text-slate-300 mb-2">Select Role</label>
          <div class="space-y-2">
            @for (r of roles; track r.value) {
              <label class="flex items-center p-4 rounded-xl cursor-pointer transition-all"
                [class]="role === r.value 
                  ? 'bg-primary-500/20 border-2 border-primary-500' 
                  : 'bg-slate-800/50 border-2 border-slate-700 hover:border-slate-600'">
                <input
                  type="radio"
                  name="role"
                  [value]="r.value"
                  [(ngModel)]="role"
                  class="sr-only"
                />
                <div class="flex-1">
                  <p class="text-white font-medium">{{ r.label }}</p>
                  <p class="text-slate-400 text-sm">{{ r.description }}</p>
                </div>
                @if (role === r.value) {
                  <svg class="w-6 h-6 text-primary-500" fill="currentColor" viewBox="0 0 20 20">
                    <path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm3.707-9.293a1 1 0 00-1.414-1.414L9 10.586 7.707 9.293a1 1 0 00-1.414 1.414l2 2a1 1 0 001.414 0l4-4z" clip-rule="evenodd"/>
                  </svg>
                }
              </label>
            }
          </div>
        </div>

        @if (errorMessage) {
          <div class="p-4 bg-red-500/20 border border-red-500/30 rounded-xl text-red-400 text-sm flex items-center gap-2">
            <svg class="w-5 h-5 flex-shrink-0" fill="currentColor" viewBox="0 0 20 20">
              <path fill-rule="evenodd" d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zm-7 4a1 1 0 11-2 0 1 1 0 012 0zm-1-9a1 1 0 00-1 1v4a1 1 0 102 0V6a1 1 0 00-1-1z" clip-rule="evenodd"/>
            </svg>
            {{ errorMessage }}
          </div>
        }

        <button type="submit" class="w-full btn-primary py-4 text-lg flex items-center justify-center gap-2" [disabled]="isLoading">
          @if (isLoading) {
            <svg class="w-5 h-5 animate-spin" fill="none" viewBox="0 0 24 24">
              <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
              <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
            </svg>
            Signing in...
          } @else {
            Sign In
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3" />
            </svg>
          }
        </button>
      </form>

      <!-- Footer -->
      <div class="mt-8 pt-6 border-t border-slate-700">
        <div class="text-center text-sm text-slate-400">
          <p class="mb-2">🔒 Demo login for testing purposes</p>
          <p>Different roles have access to different scenarios</p>
        </div>
      </div>
    </div>

    <!-- Version Info -->
    <div class="text-center mt-6 text-slate-500 text-sm">
      <p>AI Orchestrator v1.0 • Powered by Ollama LLM</p>
    </div>
  </div>
</div>
