<!-- Collapsible Admin Sidebar -->
<aside [class]="collapsed ? 'w-16' : 'w-64'"
       class="bg-white border-r border-gray-200 flex flex-col transition-all duration-300 h-full overflow-y-auto">

  <!-- Sidebar Header -->
  <div class="p-4 border-b border-gray-200 flex items-center justify-between">
    <div [class]="collapsed ? 'hidden' : 'block'" class="flex items-center gap-2">
      <div class="w-8 h-8 bg-axis-burgundy rounded-lg flex items-center justify-center">
        <svg class="w-5 h-5 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z" />
        </svg>
      </div>
      <span class="font-bold text-gray-900">Admin Panel</span>
    </div>
    <button (click)="toggleSidebar()"
            class="p-2 hover:bg-gray-100 rounded-lg transition-colors"
            [attr.aria-label]="collapsed ? 'Expand sidebar' : 'Collapse sidebar'">
      <svg class="w-5 h-5 text-gray-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              [attr.d]="collapsed ? 'M13 5l7 7-7 7M5 5l7 7-7 7' : 'M11 19l-7-7 7-7m8 14l-7-7 7-7'" />
      </svg>
    </button>
  </div>

  <!-- Navigation Links -->
  <nav class="flex-1 p-3 space-y-1 overflow-y-auto">
    <!-- Dashboard -->
    <a routerLink="/admin"
       routerLinkActive="bg-axis-burgundy text-white"
       [routerLinkActiveOptions]="{exact: true}"
       class="flex items-center gap-3 px-3 py-2.5 rounded-lg hover:bg-gray-100 transition-all"
       [class.justify-center]="collapsed">
      <svg class="w-5 h-5 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="M4 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2V6zM14 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V6zM4 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2v-2zM14 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z" />
      </svg>
      <span [class.hidden]="collapsed" class="text-sm font-medium">Dashboard</span>
    </a>

    <!-- Scenarios -->
    <a routerLink="/admin/scenarios"
       routerLinkActive="bg-axis-burgundy text-white"
       class="flex items-center gap-3 px-3 py-2.5 rounded-lg hover:bg-gray-100 transition-all"
       [class.justify-center]="collapsed">
      <svg class="w-5 h-5 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10" />
      </svg>
      <span [class.hidden]="collapsed" class="text-sm font-medium">Scenarios</span>
    </a>

    <!-- Prompts -->
    <a routerLink="/admin/prompts"
       routerLinkActive="bg-axis-burgundy text-white"
       class="flex items-center gap-3 px-3 py-2.5 rounded-lg hover:bg-gray-100 transition-all"
       [class.justify-center]="collapsed">
      <svg class="w-5 h-5 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z" />
      </svg>
      <span [class.hidden]="collapsed" class="text-sm font-medium">Prompts</span>
    </a>

    <!-- Intents - REMOVED: Intent detection now handled by Scenarios -->

    <!-- Intelligence System Section -->
    <div *ngIf="!collapsed" class="px-3 py-2 text-xs font-semibold text-gray-500 uppercase tracking-wider mb-2">
      Intelligence System
    </div>
    
    <!-- Intelligence Layers -->
    <a routerLink="/admin/intelligence/layers"
       routerLinkActive="bg-axis-burgundy text-white"
       class="flex items-center gap-3 px-3 py-2.5 rounded-lg hover:bg-gray-100 transition-all"
       [class.justify-center]="collapsed"
       [title]="collapsed ? 'Intelligence Layers' : ''">
      <svg class="w-5 h-5 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z" />
      </svg>
      <span *ngIf="!collapsed" class="text-sm font-medium">Intelligence Layers</span>
    </a>

    <!-- Entity Patterns -->
    <a routerLink="/admin/intelligence/entity-patterns"
       routerLinkActive="bg-axis-burgundy text-white"
       class="flex items-center gap-3 px-3 py-2.5 rounded-lg hover:bg-gray-100 transition-all"
       [class.justify-center]="collapsed"
       [title]="collapsed ? 'Entity Patterns' : ''">
      <svg class="w-5 h-5 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 20l4-16m2 16l4-16M6 9h14M4 15h14" />
      </svg>
      <span *ngIf="!collapsed" class="text-sm font-medium">Entity Patterns</span>
    </a>

    <!-- Embeddings -->
    <a routerLink="/admin/intelligence/embeddings"
       routerLinkActive="bg-axis-burgundy text-white"
       class="flex items-center gap-3 px-3 py-2.5 rounded-lg hover:bg-gray-100 transition-all"
       [class.justify-center]="collapsed"
       [title]="collapsed ? 'Embeddings' : ''">
      <svg class="w-5 h-5 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 7v10c0 2.21 3.582 4 8 4s8-1.79 8-4V7M4 7c0 2.21 3.582 4 8 4s8-1.79 8-4M4 7c0-2.21 3.582-4 8-4s8 1.79 8 4" />
      </svg>
      <span *ngIf="!collapsed" class="text-sm font-medium">Embeddings</span>
    </a>

    <!-- Context Memory -->
    <a routerLink="/admin/intelligence/context-memory"
       routerLinkActive="bg-axis-burgundy text-white"
       class="flex items-center gap-3 px-3 py-2.5 rounded-lg hover:bg-gray-100 transition-all"
       [class.justify-center]="collapsed"
       [title]="collapsed ? 'Context Memory' : ''">
      <svg class="w-5 h-5 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" />
      </svg>
      <span *ngIf="!collapsed" class="text-sm font-medium">Context Memory</span>
    </a>

    <div class="border-t border-gray-200 my-3"></div>

    <!-- Access Control -->
    <a routerLink="/admin/rbac"
       routerLinkActive="bg-axis-burgundy text-white"
       class="flex items-center gap-3 px-3 py-2.5 rounded-lg hover:bg-gray-100 transition-all"
       [class.justify-center]="collapsed">
      <svg class="w-5 h-5 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" />
      </svg>
      <span [class.hidden]="collapsed" class="text-sm font-medium">Access Control</span>
    </a>

    <!-- Response Mappings -->
    <a routerLink="/admin/response-mappings"
       routerLinkActive="bg-axis-burgundy text-white"
       class="flex items-center gap-3 px-3 py-2.5 rounded-lg hover:bg-gray-100 transition-all"
       [class.justify-center]="collapsed">
      <svg class="w-5 h-5 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="M7 21a4 4 0 01-4-4V5a2 2 0 012-2h4a2 2 0 012 2v12a4 4 0 01-4 4zm0 0h12a2 2 0 002-2v-4a2 2 0 00-2-2h-2.343M11 7.343l1.657-1.657a2 2 0 012.828 0l2.829 2.829a2 2 0 010 2.828l-8.486 8.485M7 17h.01" />
      </svg>
      <span [class.hidden]="collapsed" class="text-sm font-medium">Response Mappings</span>
    </a>

    <!-- Response Templates -->
    <a routerLink="/admin/response-templates"
       routerLinkActive="bg-axis-burgundy text-white"
       class="flex items-center gap-3 px-3 py-2.5 rounded-lg hover:bg-gray-100 transition-all"
       [class.justify-center]="collapsed">
      <svg class="w-5 h-5 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" />
      </svg>
      <span [class.hidden]="collapsed" class="text-sm font-medium">Response Templates</span>
    </a>

    <!-- User Feedback -->
    <a routerLink="/admin/feedback"
       routerLinkActive="bg-axis-burgundy text-white"
       class="flex items-center gap-3 px-3 py-2.5 rounded-lg hover:bg-gray-100 transition-all"
       [class.justify-center]="collapsed">
      <svg class="w-5 h-5 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="M14 10h4.764a2 2 0 011.789 2.894l-3.5 7A2 2 0 0115.263 21h-4.017c-.163 0-.326-.02-.485-.06L7 20m7-10V5a2 2 0 00-2-2h-.095c-.5 0-.905.405-.905.905 0 .714-.211 1.412-.608 2.006L7 11v9m7-10h-2M7 20H5a2 2 0 01-2-2v-6a2 2 0 012-2h2.5" />
      </svg>
      <span [class.hidden]="collapsed" class="text-sm font-medium">User Feedback</span>
    </a>

    <div class="border-t border-gray-200 my-3"></div>

    <!-- Audit Logs -->
    <a routerLink="/admin/audit-logs"
       routerLinkActive="bg-axis-burgundy text-white"
       class="flex items-center gap-3 px-3 py-2.5 rounded-lg hover:bg-gray-100 transition-all"
       [class.justify-center]="collapsed">
      <svg class="w-5 h-5 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" />
      </svg>
      <span [class.hidden]="collapsed" class="text-sm font-medium">Audit Logs</span>
    </a>

    <!-- Sessions -->
    <a routerLink="/admin/sessions"
       routerLinkActive="bg-axis-burgundy text-white"
       class="flex items-center gap-3 px-3 py-2.5 rounded-lg hover:bg-gray-100 transition-all"
       [class.justify-center]="collapsed">
      <svg class="w-5 h-5 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z" />
      </svg>
      <span [class.hidden]="collapsed" class="text-sm font-medium">Sessions</span>
    </a>

    <!-- Settings -->
    <a routerLink="/admin/settings"
       routerLinkActive="bg-axis-burgundy text-white"
       class="flex items-center gap-3 px-3 py-2.5 rounded-lg hover:bg-gray-100 transition-all"
       [class.justify-center]="collapsed">
      <svg class="w-5 h-5 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z" />
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
      </svg>
      <span [class.hidden]="collapsed" class="text-sm font-medium">Settings</span>
    </a>

    <!-- System Config (SaaS) -->
    <a routerLink="/admin/system-config"
       routerLinkActive="bg-axis-burgundy text-white"
       class="flex items-center gap-3 px-3 py-2.5 rounded-lg hover:bg-gray-100 transition-all"
       [class.justify-center]="collapsed">
      <svg class="w-5 h-5 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="M5 12h14M5 12a2 2 0 01-2-2V6a2 2 0 012-2h14a2 2 0 012 2v4a2 2 0 01-2 2M5 12a2 2 0 00-2 2v4a2 2 0 002 2h14a2 2 0 002-2v-4a2 2 0 00-2-2m-2-4h.01M17 16h.01" />
      </svg>
      <span [class.hidden]="collapsed" class="text-sm font-medium">System Config</span>
    </a>
  </nav>

  <!-- Sidebar Footer -->
  <div class="p-3 border-t border-gray-200">
    <a routerLink="/chat"
       class="flex items-center gap-3 px-3 py-2.5 bg-axis-burgundy text-white rounded-lg hover:bg-axis-maroon transition-all"
       [class.justify-center]="collapsed">
      <svg class="w-5 h-5 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z" />
      </svg>
      <span [class.hidden]="collapsed" class="text-sm font-medium">Open Chat</span>
    </a>
  </div>
</aside>
