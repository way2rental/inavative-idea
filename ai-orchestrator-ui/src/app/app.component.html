@if (showHeader) {
  <app-header></app-header>
}

<div class="app-container" [class.with-header]="showHeader">
  @if (showAdminSidebar) {
    <app-admin-sidebar
      [collapsed]="sidebarCollapsed"
      (collapsedChange)="onSidebarToggle($event)">
    </app-admin-sidebar>
  }

  <main class="app-main" [class.with-sidebar]="showAdminSidebar" [class.sidebar-collapsed]="sidebarCollapsed">
    <router-outlet></router-outlet>
  </main>
</div>

<!-- Global Alert System -->
<app-alert></app-alert>

<!-- Global Modal System -->
<app-modal></app-modal>
